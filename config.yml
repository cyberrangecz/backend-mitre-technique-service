# Required environment variables, supplied outside this file:
#   DJANGO_SECRET_KEY - key for Django cryptographic signing; the service refuses to start
#                       without it. Any high-entropy string.

# Name of the microservice.
#microservice_name: mitre-technique-service

# A boolean that turns on/off debug mode.
# SECURITY WARNING: don't run with debug turned on in production!
debug: True

# A list of strings representing the host/domain names that this Django site can serve.
#allowed_hosts: []

# If True, the whitelist will not be used and all origins will be accepted.
#cors_origin_allow_all: True

# A list of origins that are authorized to make cross-site HTTP requests.
#cors_origin_whitelist: []

application_configuration:
    # A path to directory of CA certificates or file of CA certificates, i.e. CA bundle.
    # Use in case of self-signed certificates in related services.
    ssl_ca_certificate_verify: ""

    # An address of the training service endpoint serving MITRE techniques of training definitions
    #training_mitre_techniques_endpoint: "http://127.0.0.1:8083/training/api/v1/training-definitions/played-mitre-techniques"

    # The location of jinja template and the locally stored MITRE data
    #file_storage_location: "crczp/mitre_matrix_visualizer_app/templates/"

    # Django redis to set up cache.
    redis:
        host: "localhost"
        port: 6379
        db: 1
